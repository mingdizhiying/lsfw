<header><div class="brand"><span class="monogram" aria-hidden="true">LC</span><div><h1>联成纸塑</h1><p>2026 · 业务画册</p></div></div><button id="enlarge" class="text-button">放大查看 <span aria-hidden="true">↗</span></button></header>

 <div class="navigation"><button id="prev" class="nav-button" aria-label="上一页">← <span>上一页</span></button><form id="jump"><label for="pageNumber" class="sr-only">输入页码并回车跳转</label><input id="pageNumber" type="number" min="1" max="208" value="1" inputmode="numeric" aria-label="页码"><span class="divider">/</span><span id="total">208</span><button type="submit" class="sr-only">跳转</button></form><button id="next" class="nav-button"><span>下一页</span> →</button></div>
